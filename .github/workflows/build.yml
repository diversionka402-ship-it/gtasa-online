name: Build GTA Custom Online

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Plugin-SDK
      run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git plugin-sdk

    - name: Configure CMake
      run: cmake -A Win32 -B build

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Binaries
        path: |
          build/Release/Client.asi
          build/Release/Server.exe
