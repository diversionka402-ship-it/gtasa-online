name: Build GTA Custom Online

on: [push]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Plugin-SDK
      shell: cmd
      run: git clone --depth 1 --recurse-submodules https://github.com/DK22Pac/plugin-sdk.git plugin-sdk

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Generate Plugin-SDK Visual Studio project
      shell: cmd
      run: |
        set PLUGIN_SDK_DIR=%GITHUB_WORKSPACE%\plugin-sdk
        cd plugin-sdk
        tools\generate\Visual Studio.bat

    - name: Build Plugin-SDK
      shell: cmd
      run: |
        cd plugin-sdk
        msbuild plugin.sln /property:Configuration=Release /property:Platform="Mixed Platforms" /target:plugin_sa /m

    - name: Configure CMake
      run: cmake -A Win32 -B build

    - name: Build Project
      run: cmake --build build --config Release

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Binaries
        path: |
          build/Release/Client.asi
          build/Release/Server.exe
